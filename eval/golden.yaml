# SupportPilot golden eval set (Phase 7): normal customers, not attackers.
#
# Fields
#   message / messages : what you type in Telegram (messages = a multi-turn flow, e.g. ask, then "yes")
#   expect_tools       : tools that MUST have been called (read from agent_runs.tools_used)
#   forbid_tools       : tools that must NOT have been called
#   expect_escalated   : true / false. Was the case handed to a human? (agent_runs.route = 'escalate')
#   all_of / any_of / none_of : regexes on the final reply (all must match / at least one / none may match)
#   language           : roman_urdu or english. Does the reply use the customer's language?
#   expect_actions     : actions that must have COMPLETED, e.g. {action: cancel_order, order: SE-1003}
#   escalates: true    : this case locks the chat, so run reset_fixtures.sql before it
# Every case also fails if an action completed that it did not expect.
#
# Fixture facts (after reset_fixtures.sql):
#   SE-1001 delivered 3d ago, Phone Case x2, PKR 1,460 COD   (returnable)
#   SE-1002 delivered 20d ago (outside the 7-day window)
#   SE-1003 placed 2h ago (cancellable)        SE-1004 shipped 3d ago (not late)
#   SE-1005 shipped 10d ago (LATE)             SE-1006 out for delivery
#   SE-1007 belongs to another customer.

# ---------------- order status ----------------
- id: E01
  category: order_status
  language: english
  message: "where is my order SE-1006"
  expect_tools: [get_order]
  expect_escalated: false
  any_of: ['out for delivery|today|aaj']

- id: E02
  category: order_status
  language: english
  message: "status of SE-1004?"
  expect_tools: [get_order]
  expect_escalated: false
  all_of: ['shipped']

- id: E03
  category: order_status
  message: "order SE-1003 ka kya status hai?"
  expect_tools: [get_order]
  expect_escalated: false
  language: roman_urdu
  any_of: ['placed|pack|process|received']

- id: E04
  category: order_status
  language: english
  message: "has SE-1001 been delivered?"
  expect_tools: [get_order]
  all_of: ['deliver']

- id: E05
  category: order_status
  language: english
  message: "what did I order in SE-1001 and how much was it?"
  expect_tools: [get_order]
  all_of: ['phone case', '1,?460']

- id: E06
  category: order_status
  language: english
  message: "I don't remember my order number, what are my recent orders?"
  expect_tools: [list_recent_orders]
  all_of: ['SE-1']

- id: E07
  category: order_status
  language: english
  message: "where is SE-9999"
  expect_tools: [get_order]
  expect_escalated: false
  any_of: ["can.?t find|couldn.t find|not find|unable to find"]
  none_of: ['SE-1007']

- id: E08
  category: order_status
  language: english
  message: "where is my order"
  expect_escalated: false
  any_of: ['order number|which order|SE-|recent orders']

# ---------------- policy (knowledge base) ----------------
- id: E09
