  none_of: ['yes, we deliver (worldwide|internationally)']

- id: E13
  category: policy
  language: english
  message: "Is delivery free?"
  expect_tools: [search_kb]
  all_of: ['free']

- id: E14
  category: policy
  language: english
  message: "What are your support hours?"
