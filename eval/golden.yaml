# ---------------- actions ----------------
- id: E19
  category: action
  messages: ["cancel order SE-1003", "yes"]
  expect_tools: [propose_cancel]
  expect_actions:
    - {action: cancel_order, order: SE-1003}
  any_of: ['cancel']

- id: E20
  category: action
  language: english
  message: "cancel order SE-1004"
  expect_tools: [propose_cancel]
  any_of: ['shipped|can.?t|cannot|not possible|unable']
  none_of: ['(has been|have been|is now) cancel+ed']

- id: E21
  category: action
  messages: ["I changed my mind, I want to return SE-1001", "yes"]
  expect_tools: [propose_return]
  expect_actions:
    - {action: return_request, order: SE-1001}
  any_of: ['approved|1,?210|refund']

- id: E22
  category: action
  language: english
  message: "I want to return SE-1002"
  expect_tools: [propose_return]
  any_of: ['window|7 days|outside|not eligible|can.?t|cannot|warranty|unable']

